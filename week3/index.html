<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="간단한 자기소개서 프로필">
    <title>3주차과제</title>
    <meta property="og:description" content="간단한 자기소개서 프로필">
    <meta property="og:title" content="3주차과제">
    <meta property="og:url" content="https://yunchungwoo.github.io/web-practice-2026/week3/">
</head>
<body>
    <header>
        <h1>윤청우 프로필</h1>
        <img src="./universityLogo.png" alt="프로필 이미지(대학 로고 이미지)" />
    </header>
    <main>
        <h1>간단한 자기소개</h1>

        <h2>자기소개</h2>
        <p>안녕하세요, 기초웹개발론을 수강하고 있는 윤청우하고 합니다.<br /></p>
        <p>제 전공은 <strong>컴퓨터공학과</strong>입니다.<br /></p>
        <p>저는 <em>웹 개발</em>에 관심이 많습니다. 앞으로 열심히 하겠습니다.</p>

        <h2>배우고 있는 것들</h2>
        <ul>
            <li>HTML</li>
            <li>CSS</li>
        </ul>

        <h2>문의하기</h2>
        <form>
            <fieldset>
                <legend>문의 상세 내용</legend>

                <label for="name">이름</label>
                <input type="text" id="name" placeholder="이름을 입력해주세요." />

                <label for="email">이메일</label>
                <input type="email" id="email" placeholder="이메일을 입력해주세요." />

                <label for="1">문의유형</label>
                <select id="1">
                    <option value="a" selected>질문 1</option>
                    <option value="b" selected>제의 2</option>
                    <option value="c">기타 3</option>
                </select>

                <label for="2">문의내용</label>
                <textarea id="2" placeholder="문의사항 입력"></textarea>

                <label for="buttonSubmit"></label>
                <Button type="submit" id="buttonSubmit">보내기</Button>
            </fieldset>
        </form>
    </main>
    <footer>
        <p>Copyright (c) 2026 YUN CHUNG WOO.</p>
        <p>email : iuci5st23@gmail.com</p>
    </footer>
</body>
</html>
